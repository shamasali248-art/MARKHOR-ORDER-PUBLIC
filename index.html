    <div style="flex:1"><div class="name">${p.name}</div><div class="desc">${p.desc}</div></div>
    <div class="actions">
      <select id="opt-${p.id}">${priceOptions(p)}</select>
      <button class="add" onclick="add('${p.id}')">Añadir</button>
    </div>
   </div>`;
 }).join('') || '<p>No se encontraron productos.</p>';
}
function add(id){
 const p=products.find(x=>x.id===id); const sel=document.getElementById('opt-'+id);
 const size=sel.value; const price=Number(sel.selectedOptions[0].dataset.price);
 const key=id+'|'+size; const old=cart.find(x=>x.key===key);
 if(old) old.qty++; else cart.push({key,id,size,price,qty:1});
 save();
}
function renderCartBar(){
 const n=cart.reduce((a,x)=>a+x.qty,0), t=cart.reduce((a,x)=>a+x.qty*x.price,0);
 document.getElementById('count').textContent=n; document.getElementById('barTotal').textContent=money(t);
}
function openCart(){
 const el=document.getElementById('cartItems');
 el.innerHTML=cart.length?cart.map((x,i)=>{
   const p=products.find(p=>p.id===x.id);
   return `<div class="row"><div><b>${p.name}</b><div class="small">${x.size} · ${money(x.price)}</div></div><div><button onclick="chg(${i},-1)">−</button> ${x.qty} <button onclick="chg(${i},1)">+</button></div></div>`;
 }).join(''):'<p>Tu carrito está vacío.</p>';
 const t=cart.reduce((a,x)=>a+x.qty*x.price,0); document.getElementById('total').textContent=money(t);
 document.getElementById('modal').classList.add('open');
}
function closeCart(){document.getElementById('modal').classList.remove('open')}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();openCart()}
function sendOrder(){
 if(!cart.length) return alert('Añade algún producto.');
 const total=cart.reduce((a,x)=>a+x.qty*x.price,0);
 if(total<10) return alert('El pedido mínimo a domicilio es 10 €.');
 const name=document.getElementById('customer').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const address=document.getElementById('address').value.trim();
 const type=document.getElementById('type').value;
 const payment=document.getElementById('payment').value;
 if(!name||!phone) return alert('Escribe tu nombre y teléfono.');
 if(type==='Entrega a domicilio'&&!address) return alert('Escribe la dirección de entrega.');
 const lines=cart.map(x=>{const p=products.find(p=>p.id===x.id);return `• ${x.qty}x ${p.name} (${x.size}) = ${money(x.qty*x.price)}`;}).join('%0A');
 const msg=`*NUEVO PEDIDO - MARKHOR*%0A%0A${lines}%0A%0A*Total: ${money(total)}*%0ANombre: ${name}%0ATeléfono: ${phone}%0ATipo: ${type}%0ADirección: ${address||'-'}%0APago: ${payment}`;
 window.open('https://wa.me/34614809001?text='+msg,'_blank');
}
document.getElementById('search').addEventListener('input',()=>renderMenu());
renderTabs(); renderMenu(cats[0]); renderCartBar();
</script>
